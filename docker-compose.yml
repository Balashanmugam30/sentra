services:
  postgres:
    image: postgres:16-alpine
    container_name: sentra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sentra}
      POSTGRES_USER: ${DB_USER:-sentra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentra_net

  redis:
    image: redis:7-alpine
    container_name: sentra_redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-256mb}",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentra_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentra_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      SENTRA_APP_ENV: ${APP_ENV:-production}
      SENTRA_API_PREFIX: ""
      SENTRA_HOST: 0.0.0.0
      SENTRA_PORT: 8000
      SENTRA_APP_VERSION: ${SENTRA_APP_VERSION:-0.1.0}
      SENTRA_RELEASE_CHANNEL: ${SENTRA_RELEASE_CHANNEL:-production}
      SENTRA_RELEASE_COMMIT_SHA: ${SENTRA_RELEASE_COMMIT_SHA:-local}
      SENTRA_LOG_LEVEL: ${SENTRA_LOG_LEVEL:-INFO}
      SENTRA_LOG_FILE_PATH: /data/logs/sentra-backend.jsonl
      SECRET_KEY: ${SECRET_KEY:-replace_with_a_long_random_secret}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_jwt_secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-sentra}:${DB_PASSWORD:-change_me}@postgres:5432/${DB_NAME:-sentra}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
      SENTRA_COOKIE_SECURE: ${SENTRA_COOKIE_SECURE:-false}
      SENTRA_AUTH_STORE_PATH: /data/auth_store.json
      SENTRA_AUDIT_STORE_PATH: /data/audit_store.json
      SENTRA_MQTT_ENABLED: ${SENTRA_MQTT_ENABLED:-false}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-demo}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      DEFAULT_LAT: ${DEFAULT_LAT:-11.0168}
      DEFAULT_LNG: ${DEFAULT_LNG:-76.9558}
      TRAFFIC_PROVIDER: ${TRAFFIC_PROVIDER:-demo}
      TRANSIT_PROVIDER: ${TRANSIT_PROVIDER:-demo}
      UTILITY_PROVIDER: ${UTILITY_PROVIDER:-demo}
      CITY_MODE: ${CITY_MODE:-campus}
      OSINT_PROVIDER: ${OSINT_PROVIDER:-demo}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      RSS_FEEDS: ${RSS_FEEDS:-}
      SOCIAL_PROVIDER: ${SOCIAL_PROVIDER:-demo}
      CITY_KEYWORDS: ${CITY_KEYWORDS:-coimbatore,campus,zone,incident}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SENTRA_ALERT_EMAIL_TO: ${SENTRA_ALERT_EMAIL_TO:-}
      SENTRA_BACKUP_RETENTION_DAYS: ${SENTRA_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backend_data:/data
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - sentra_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Sentra}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-/ws/incidents}
        NEXT_PUBLIC_ENABLE_REALTIME: ${NEXT_PUBLIC_ENABLE_REALTIME:-true}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-true}
        NEXT_PUBLIC_ENABLE_DEMO_MODE: ${NEXT_PUBLIC_ENABLE_DEMO_MODE:-true}
        NEXT_PUBLIC_ENABLE_REALTIME_MAP: ${NEXT_PUBLIC_ENABLE_REALTIME_MAP:-false}
        NEXT_PUBLIC_ENABLE_COMMAND_SURFACE_EXPERIMENTAL: ${NEXT_PUBLIC_ENABLE_COMMAND_SURFACE_EXPERIMENTAL:-false}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-demo}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-demo.local}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-sentra-demo}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-sentra-demo.appspot.com}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-demo}
    container_name: sentra_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_PROXY_ORIGIN: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - sentra_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sentra_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sentra_net

networks:
  sentra_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_data:
