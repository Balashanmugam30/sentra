name: CD

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Image/release tag to deploy
        required: true
        default: latest
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.release_tag }}}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging blue/green
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git pull --ff-only
            ENV_FILE=.env.staging scripts/deploy-blue-green.sh blue
      - name: Local compose smoke fallback
        if: ${{ env.DEPLOY_HOST == '' }}
        run: |
          docker compose config
          echo "No staging host configured; compose config verified."

  production-approval:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - run: echo "Manual production gate approved."

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, production-approval]
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production blue/green
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          username: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          script: |
            cd ${{ secrets.PRODUCTION_DEPLOY_PATH }}
            git pull --ff-only
            ENV_FILE=.env.production scripts/deploy-blue-green.sh green || scripts/rollback.sh blue
      - name: Production deployment instructions
        if: ${{ env.DEPLOY_HOST == '' }}
        run: echo "Configure production SSH secrets to enable automatic deployment."
