name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check app tests
      - run: black --check app/core/observability.py app/main.py app/auth/router.py app/routes/incident_routes.py tests
      - run: mypy --explicit-package-bases --follow-imports=skip app/core/observability.py app/main.py app/auth/router.py app/routes/incident_routes.py
      - run: python -m pytest
      - run: python -m compileall app

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile.frontend -t sentra/frontend:ci .
      - run: docker build -f Dockerfile.backend -t sentra/backend:ci .
