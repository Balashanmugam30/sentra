name: Security

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  schedule:
    - cron: "20 2 * * *"

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt --strict

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile.backend -t sentra/backend:security .
      - run: docker build -f Dockerfile.frontend -t sentra/frontend:security .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentra/backend:security
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentra/frontend:security
          severity: CRITICAL,HIGH
          exit-code: "1"
