name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example v1.0.1
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate semantic version
        run: |
          if ! [[ "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Generate changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" > CHANGELOG_RELEASE.md
          else
            git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" > CHANGELOG_RELEASE.md
          fi
      - name: Create tag
        run: |
          git tag "${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body_path: CHANGELOG_RELEASE.md
